name: Documentation

# Builds the Sphinx site and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Nothing else is needed; no branch, no token.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'backend/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running build finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the documentation toolchain
        # Only the docs group: Sphinx reads the backend's docstrings with autodoc, and
        # conf.py mocks the runtime imports, so none of them need installing here.
        run: uv sync --only-group docs

      - name: Build
        # -W turns warnings into errors, so a broken reference fails the build
        # rather than quietly shipping a dead link.
        run: uv run --no-sync python -m sphinx -b html -W --keep-going docs docs/_build/html

      - name: Check every internal link
        run: uv run --no-sync python -m sphinx -b linkcheck docs docs/_build/linkcheck || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Pull requests build but do not publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
