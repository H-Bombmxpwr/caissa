name: Release

# PyInstaller cannot cross-compile: a Windows .exe has to be built on Windows, a macOS
# .app on macOS, a Linux binary on Linux. So the same build runs three times, once per
# runner, and the three archives are attached to one GitHub Release.
#
# Cut a release by pushing a tag:
#     git tag v2.1.0 && git push origin v2.1.0
#
# Or run this workflow by hand to produce the artifacts without publishing anything.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v2.2.0 (required when publishing)'
        required: false
        default: 'dev'
      publish:
        description: 'Publish the downloads on GitHub Releases and the download website'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Windows is the supported platform and must build. macOS and Linux are marked
    # experimental: they are built on every release and their failure is reported, but
    # it does not hold back a release of the platform that does work.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            asset: Caissa-windows-x64.zip
          - os: macos-latest
            label: macOS (Apple silicon)
            asset: Caissa-macos-arm64.zip
            experimental: true
          - os: ubuntu-latest
            label: Linux x64
            asset: Caissa-linux-x64.tar.gz
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: python
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          import os, re
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:[-.][A-Za-z0-9.]+)?', os.environ['RELEASE_VERSION']):
              raise SystemExit('Publishing requires a version tag such as v2.2.0')

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # pywebview needs a native web view and its Python bindings. Windows has Edge
      # WebView2 and macOS has WKWebView already; Linux needs WebKitGTK. The system
      # python3-gi package installs into the system interpreter, not the one
      # actions/setup-python provides, so the bindings are installed with pip too —
      # which needs the girepository headers to build against.
      - name: Install the Linux web view
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
                                  libgirepository1.0-dev libcairo2-dev pkg-config
          python -m pip install --upgrade pip
          pip install pycairo PyGObject

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fetch the engine and the bundled data
        run: |
          python tools/fetch_stockfish.py
          python tools/fetch_openings.py
          python tools/fetch_sounds.py
          python tools/fetch_pieces.py

      - name: Build
        run: python -m PyInstaller --noconfirm caissa.spec

      - name: Show what was produced
        shell: bash
        run: ls -la dist

      # chess.com's sounds are never shipped; the spec strips them, and this is the
      # belt to that pair of braces.
      - name: Check nothing proprietary got in
        shell: bash
        run: |
          if find dist -path '*sound/chesscom*' | grep -q .; then
            echo "chess.com audio must never be shipped"; exit 1
          fi

      - name: Smoke-test the build
        if: runner.os == 'Windows'
        run: python tests/check_bundle.py

      - name: Package (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd dist
          if [ -d Caissa.app ]; then
            ditto -c -k --keepParent Caissa.app "../${{ matrix.asset }}"
          else
            7z a "../${{ matrix.asset }}" Caissa
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist Caissa

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: Write the release notes from what actually built
        id: notes
        shell: bash
        run: |
          cd downloads
          ls -la
          {
            echo 'Download the build for your platform, unpack it, and run **Caissa**.'
            echo
            for f in *; do
              size=$(du -h "$f" | cut -f1)
              case "$f" in
                *windows*) echo "* **Windows** — \`$f\` ($size). SmartScreen will warn about an"
                           echo "  unsigned application: choose *More info → Run anyway*." ;;
                *macos*)   echo "* **macOS** — \`$f\` ($size). Not notarised, so the first launch"
                           echo "  needs *right-click → Open* rather than a double-click." ;;
                *linux*)   echo "* **Linux** — \`$f\` ($size). Needs WebKitGTK:"
                           echo '  `sudo apt install gir1.2-webkit2-4.1 python3-gi`.' ;;
              esac
            done
            echo
            for want in windows macos linux; do
              if ! ls | grep -qi "$want"; then
                case "$want" in
                  windows) echo '> **Windows is not in this release.** Build from source: see the README.' ;;
                  macos)   echo '> **macOS is not in this release yet.** The build is still being brought up;'
                           echo '> run from source in the meantime — see the README.' ;;
                  linux)   echo '> **Linux is not in this release yet.** The build is still being brought up;'
                           echo '> run from source in the meantime — see the README.' ;;
                esac
                echo
              fi
            done
            echo 'Your library is kept outside the application folder, so replacing this build'
            echo 'never touches your games. See the [documentation](https://h-bombmxpwr.github.io/caissa/).'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Attach the builds to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: downloads/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
